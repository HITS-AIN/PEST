num_workers: 4
shuffle: True
seed: 42

extract:
  class_path: pest.IllustrisExtractor
  init_args:
    simulation_path: /urz/gpuscratch/its/data/Illustris
    simulation: TNG50-1
    snapshot: 99
    objects: centrals
    component:
      - name: stars
        fields:
          - masses
          - positions
          - velocities
          - ages
          - metallicities
        selector:
          type: stellar mass
          min: 5.0e+10
          max: 5.2e+10
      - name: gas
        fields:
          - masses
          - positions
      - name: dark_matter
        fields:
          - masses
          - positions

load:
  - class_path: pest.ParquetWriter
    init_args:
      output_path: output/illustris_pointcloud.parquet
